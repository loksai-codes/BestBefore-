<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" fill="none">
  <!-- Calendar Tag Icon Mark -->
  <g transform="translate(4, 4)">
    <!-- Outer Tag / Calendar Card -->
    <rect x="0" y="2" width="36" height="36" rx="9" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="2" stroke-linejoin="round"/>
    <!-- Top Calendar Bar Header -->
    <path d="M0 12C0 7.58172 3.58172 4 8 4H28C32.4183 4 36 7.58172 36 12V13H0V12Z" fill="#10b981" fill-opacity="0.25"/>
    <!-- Tag Hole / Calendar Rings -->
    <circle cx="10" cy="8.5" r="1.5" fill="#34d399"/>
    <circle cx="26" cy="8.5" r="1.5" fill="#34d399"/>
    <!-- Clock / Freshness Checkmark Stamp Glyph -->
    <circle cx="18" cy="24" r="8" stroke="#34d399" stroke-width="1.8" stroke-dasharray="2 1"/>
    <!-- Clock Hands stamping the date -->
    <path d="M18 20V24L21 26" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark: Best (weight 400) + Before (weight 800) -->
  <text x="54" y="30" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" letter-spacing="-0.03em">
    <tspan fill="#f4f4f5" font-weight="400">Best</tspan>
    <tspan fill="#ffffff" font-weight="800">Before</tspan>
  </text>

  <!-- Subtitle Tagline Pill -->
  <rect x="180" y="16" width="92" height="18" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="226" y="28.5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.08em">FRESH STAMP</text>
</svg>

